name: Local agent drafts on owner runner
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [ollama, lmstudio]
        default: ollama
        description: Moteur déjà démarré sur le runner Windows
      model:
        type: string
        required: true
        description: Identifiant exact du modèle LOCAL chargé
      roles:
        type: string
        default: qa,security
        description: Identifiants des responsables séparés par virgules
      brief:
        type: string
        required: true
        description: Travail à produire en brouillon sans action externe
permissions:
  contents: read
concurrency:
  group: gdhq-local-model
  cancel-in-progress: false
jobs:
  drafts:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, gdhq]
    environment: gdhq-windows
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run text-only local agents
        shell: pwsh
        env:
          GDHQ_PROVIDER: ${{ inputs.provider }}
          GDHQ_MODEL: ${{ inputs.model }}
          GDHQ_ROLES: ${{ inputs.roles }}
          GDHQ_BRIEF: ${{ inputs.brief }}
        run: |
          python scripts/run_agent_workflow.py --provider "$env:GDHQ_PROVIDER" --model "$env:GDHQ_MODEL" --roles "$env:GDHQ_ROLES" --brief "$env:GDHQ_BRIEF"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-agent-drafts
          path: agent-output/
          retention-days: 7
          if-no-files-found: error
