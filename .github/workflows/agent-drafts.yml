name: Local agent drafts on owner runner
on:
  workflow_dispatch:
    inputs:
      provider:
        type: choice
        options: [ollama, lmstudio]
        default: ollama
        description: Moteur déjà démarré sur le runner Windows
      model:
        type: string
        required: true
        description: Identifiant exact du modèle LOCAL chargé
      roles:
        type: string
        default: qa,security
        description: Identifiants des responsables séparés par virgules
      brief:
        type: string
        required: true
        description: Travail à produire en brouillon sans action externe
permissions:
  contents: read
concurrency:
  group: gdhq-local-model
  cancel-in-progress: false
jobs:
  drafts:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, gdhq]
    environment: gdhq-windows
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
      - name: Run text-only local agents
        shell: cmd
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          GDHQ_PROVIDER: ${{ inputs.provider }}
          GDHQ_MODEL: ${{ inputs.model }}
          GDHQ_ROLES: ${{ inputs.roles }}
          GDHQ_BRIEF: ${{ inputs.brief }}
        run: |
          python -c "import os,runpy,sys; sys.argv=['scripts/run_agent_workflow.py']+['--'+k.lower()+'='+os.environ['GDHQ_'+k] for k in ['PROVIDER','MODEL','ROLES','BRIEF']]; runpy.run_path(sys.argv[0],run_name='__main__')"
          if errorlevel 1 exit /b 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          name: local-agent-drafts
          path: agent-output/
          retention-days: 7
          if-no-files-found: error
