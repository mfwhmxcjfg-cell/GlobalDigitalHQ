name: Deploy Global on owner Windows runner
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Global fermé ; saisir DEPLOY_LOCAL pour installer le code sur ce PC'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gdhq-windows-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_LOCAL'
    runs-on: [self-hosted, Windows, gdhq]
    environment: gdhq-windows
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        with:
          persist-credentials: false
      - name: Verify checkout and provenance
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: cmd
        run: |
          python -m unittest discover -s tests -v
          if errorlevel 1 exit /b 1
          python -c "from gdhq.ecosystem import verify_sources; assert not verify_sources(), verify_sources()"
          if errorlevel 1 exit /b 1
          where node >nul 2>nul
          if not errorlevel 1 (
            node --check web/app.js
            if errorlevel 1 exit /b 1
          ) else (
            echo Node absent: JS validation remains available in Validate and package Global.
          )
          exit /b 0
      - name: Back up and install local code
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: cmd
        run: |
          python scripts/deploy_windows.py --confirm DEPLOY_LOCAL --install-root "D:\GlobalDigitalHQ"
          if errorlevel 1 exit /b 1
