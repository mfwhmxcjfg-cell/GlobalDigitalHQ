name: Validate and package Global
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-global
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows regression and DPAPI checks on temporary data
        shell: cmd
        run: |
          python -m unittest discover -s tests -v
          if errorlevel 1 exit /b 1
          python scripts/audit_models.py
          if errorlevel 1 exit /b 1
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python regression tests
        run: python3 -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Inventory model references without network or runtime state
        run: python3 scripts/audit_models.py
      - name: Validate source provenance
        run: python3 -c "from gdhq.ecosystem import verify_sources; assert not verify_sources(), verify_sources()"
      - name: Build private installable package
        run: python3 scripts/package_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: GlobalDigitalHQ-1.5.0
          path: dist/*
          retention-days: 7
          if-no-files-found: error
